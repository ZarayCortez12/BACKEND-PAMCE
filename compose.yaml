# Se ejecuta con: podman compose up -d --build   (o podman-compose up -d --build)
# Lee las variables de .env (copia .env.example como .env y complétalo).
# La base de datos NO va en un contenedor: se usa el PostgreSQL de la
# universidad. Indica su servidor en DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASS.
services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/pamce-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # La clave de Firebase se monta como archivo de solo lectura
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase.json
    ports:
      - "4000:4000"
    volumes:
      # Documentos subidos: carpeta del servidor, persiste aunque se baje el
      # contenedor. En el servidor se puede cambiar por una ruta absoluta
      # (por ejemplo /var/pamce/documentos). Si hay errores de permisos al
      # subir archivos, agrega :U al final.
      - ./documentos:/app/src/documentos
      # En un servidor con SELinux (RHEL, Rocky, Fedora) agrega ,Z al final
      - ./secrets/serviceAccountKey.json:/secrets/firebase.json:ro
